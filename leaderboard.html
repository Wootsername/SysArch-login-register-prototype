<!DOCTYPE html>
<html lang="en" data-theme="dark">
<script>(function(){var t=localStorage.getItem('ccs_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Leaderboard - CCS Sit-in Monitoring System</title>
    <meta name="description" content="Top students ranked by completed sit-in sessions in the CCS Sit-in Monitoring System.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box}
        :root{--bg-0:#081325;--bg-1:#0a1d34;--bg-2:#0f2b46;--panel:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);--text:#e6edf7;--muted:rgba(230,237,247,0.62);--accent:#2196f3;--shadow:0 18px 50px rgba(0,0,0,0.28)}
        body{margin:0;min-height:100vh;font-family:'Inter','Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at top left,rgba(33,150,243,0.15),transparent 32%),radial-gradient(circle at bottom right,rgba(124,58,237,0.16),transparent 30%),linear-gradient(135deg,var(--bg-0) 0%,var(--bg-1) 42%,var(--bg-2) 100%);color:var(--text);overflow-x:hidden}
        .orb-container{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.28;animation:orbFloat 18s ease-in-out infinite alternate}
        .orb-1{width:400px;height:400px;background:#2196F3;top:-8%;left:-7%}
        .orb-2{width:330px;height:330px;background:#7c3aed;bottom:-10%;right:-8%;animation-duration:24s;animation-delay:-5s}
        .orb-3{width:270px;height:270px;background:#06b6d4;top:52%;left:58%;animation-duration:22s;animation-delay:-10s}
        @keyframes orbFloat{0%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-35px) scale(1.08)}66%{transform:translate(-30px,45px) scale(0.96)}100%{transform:translate(15px,-18px) scale(1.03)}}
        .page-wrapper{position:relative;z-index:1;animation:pageIn .6s cubic-bezier(.4,0,.2,1) both}
        @keyframes pageIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
        .navbar{position:relative;z-index:1050;background:rgba(15,34,60,0.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,0.08)}
        .navbar-brand{color:#fff!important;font-size:1rem;font-weight:600;letter-spacing:.2px}
        .nav-link{color:rgba(255,255,255,0.8)!important;font-size:.95rem;transition:color .2s ease}
        .nav-link:hover,.nav-link.active{color:#fff!important}
        .dropdown-menu-dark{background:rgba(10,22,42,0.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:8px;box-shadow:0 16px 48px rgba(0,0,0,0.4);margin-top:8px!important}
        .dropdown-menu-dark .dropdown-item{color:rgba(255,255,255,0.82);border-radius:8px;padding:9px 14px;font-size:.92rem;transition:background .2s ease}
        .dropdown-menu-dark .dropdown-item:hover{background:rgba(33,150,243,0.18);color:#fff}
        .dropdown-menu-dark .dropdown-item i{color:#8fd0ff}
        .dropdown-menu-dark .dropdown-divider{border-color:rgba(255,255,255,0.08);margin:4px 0}
        .dashboard-shell{padding:28px 20px 48px}
        .glass-card{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
        .theme-toggle{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fbbf24;border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;font-size:1.1rem}
        .theme-toggle:hover{background:rgba(255,255,255,0.18);transform:scale(1.08)}

        /* ── Leaderboard Hero ── */
        .lb-hero{padding:32px 28px;text-align:center;margin-bottom:28px;position:relative;overflow:hidden}
        .lb-hero::before{content:'';position:absolute;top:-40%;left:-10%;width:120%;height:180%;background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,0.18),transparent 60%);pointer-events:none}
        .lb-hero-icon{font-size:3rem;margin-bottom:12px;display:inline-block;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .lb-hero h1{font-size:clamp(1.8rem,3vw,2.6rem);font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#ffd700 0%,#f0c040 40%,#ffffff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
        .lb-hero p{color:var(--muted);font-size:1rem;max-width:52ch;margin:0 auto}

        /* ── Leaderboard Table ── */
        .lb-card{padding:0;overflow:hidden}
        .lb-table{width:100%;border-collapse:collapse;margin:0}
        .lb-table thead th{padding:14px 18px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(207,232,255,0.85);border-bottom:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);font-weight:700}
        .lb-table tbody tr{transition:background .2s ease,transform .15s ease}
        .lb-table tbody tr:hover{background:rgba(255,255,255,0.04)}
        .lb-table tbody td{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.06);vertical-align:middle;font-size:.94rem}
        .lb-table tbody tr:last-child td{border-bottom:none}

        /* Rank badges */
        .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;font-weight:800;font-size:1rem;transition:transform .2s ease}
        .rank-badge:hover{transform:scale(1.12)}
        .rank-gold{background:linear-gradient(135deg,#ffd700,#f0a500);color:#1a1200;box-shadow:0 4px 18px rgba(255,215,0,0.35)}
        .rank-silver{background:linear-gradient(135deg,#c0c0c0,#a0a0a0);color:#1a1a1a;box-shadow:0 4px 18px rgba(192,192,192,0.3)}
        .rank-bronze{background:linear-gradient(135deg,#cd7f32,#a0622e);color:#fff;box-shadow:0 4px 18px rgba(205,127,50,0.3)}
        .rank-default{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--muted)}

        /* Row highlights for top 3 */
        .row-gold{background:rgba(255,215,0,0.04)!important;border-left:3px solid #ffd700}
        .row-silver{background:rgba(192,192,192,0.03)!important;border-left:3px solid #c0c0c0}
        .row-bronze{background:rgba(205,127,50,0.03)!important;border-left:3px solid #cd7f32}

        .student-name{font-weight:600}
        .student-id{color:var(--muted);font-size:.84rem}
        .session-count{font-size:1.2rem;font-weight:800;color:#8fd0ff}
        .session-label{color:var(--muted);font-size:.78rem;margin-left:4px}

        .lb-empty{text-align:center;padding:60px 20px;color:var(--muted)}
        .lb-empty i{font-size:3rem;opacity:.4;margin-bottom:12px;display:block}
        .lb-loading{text-align:center;padding:60px 20px;color:var(--muted)}
        .lb-loading .spinner-border{width:2rem;height:2rem;border-width:.2em}

        /* ── Podium (top 3 cards) ── */
        .podium{display:flex;justify-content:center;gap:18px;margin-bottom:32px;flex-wrap:wrap}
        .podium-card{flex:0 1 200px;padding:24px 16px;text-align:center;border-radius:18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);transition:transform .3s ease,box-shadow .3s ease;position:relative;overflow:hidden}
        .podium-card:hover{transform:translateY(-6px)}
        .podium-card.gold{border-color:rgba(255,215,0,0.3);box-shadow:0 8px 30px rgba(255,215,0,0.12)}
        .podium-card.gold::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ffd700,#f0a500)}
        .podium-card.silver{border-color:rgba(192,192,192,0.25);box-shadow:0 8px 30px rgba(192,192,192,0.08)}
        .podium-card.silver::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#c0c0c0,#888)}
        .podium-card.bronze{border-color:rgba(205,127,50,0.25);box-shadow:0 8px 30px rgba(205,127,50,0.08)}
        .podium-card.bronze::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#cd7f32,#a0622e)}
        .podium-rank{font-size:2rem;font-weight:800;line-height:1;margin-bottom:8px}
        .podium-rank.gold-text{color:#ffd700}
        .podium-rank.silver-text{color:#c0c0c0}
        .podium-rank.bronze-text{color:#cd7f32}
        .podium-name{font-weight:700;font-size:1rem;margin-bottom:4px}
        .podium-id{color:var(--muted);font-size:.82rem;margin-bottom:8px}
        .podium-sessions{font-size:1.5rem;font-weight:800;color:#8fd0ff}
        .podium-sessions-label{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}

        /* ── Light Theme ── */
        [data-theme="light"]{--bg-0:#f0f4f8;--bg-1:#e2e8f0;--bg-2:#cbd5e1;--panel:rgba(255,255,255,0.82);--border:rgba(0,0,0,0.1);--text:#1e293b;--muted:rgba(30,41,59,0.62);--shadow:0 18px 50px rgba(0,0,0,0.08)}
        [data-theme="light"] body{background:radial-gradient(circle at top left,rgba(33,150,243,0.08),transparent 32%),radial-gradient(circle at bottom right,rgba(124,58,237,0.06),transparent 30%),linear-gradient(135deg,var(--bg-0) 0%,var(--bg-1) 42%,var(--bg-2) 100%);color:var(--text)}
        [data-theme="light"] .orb{opacity:.08}
        [data-theme="light"] .navbar{background:rgba(255,255,255,0.82);border-bottom:1px solid rgba(0,0,0,0.08)}
        [data-theme="light"] .navbar-brand{color:#1e293b!important}
        [data-theme="light"] .nav-link{color:rgba(30,41,59,0.72)!important}
        [data-theme="light"] .nav-link:hover,[data-theme="light"] .nav-link.active{color:#1e293b!important}
        [data-theme="light"] .dropdown-menu-dark{background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);box-shadow:0 16px 48px rgba(0,0,0,0.12)}
        [data-theme="light"] .dropdown-menu-dark .dropdown-item{color:#334155}
        [data-theme="light"] .dropdown-menu-dark .dropdown-item:hover{background:rgba(33,150,243,0.1);color:#1e293b}
        [data-theme="light"] .dropdown-menu-dark .dropdown-item i{color:#2563eb}
        [data-theme="light"] .glass-card{background:var(--panel);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,0.06)}
        [data-theme="light"] .lb-hero h1{background:linear-gradient(135deg,#b8860b 0%,#8b6914 40%,#1e293b 100%);-webkit-background-clip:text;background-clip:text}
        [data-theme="light"] .lb-table thead th{color:#1e40af;background:rgba(0,0,0,0.02);border-bottom:1px solid rgba(0,0,0,0.1)}
        [data-theme="light"] .lb-table tbody tr:hover{background:rgba(0,0,0,0.02)}
        [data-theme="light"] .lb-table tbody td{border-bottom:1px solid rgba(0,0,0,0.05)}
        [data-theme="light"] .session-count{color:#2563eb}
        [data-theme="light"] .podium-sessions{color:#2563eb}
        [data-theme="light"] .rank-default{background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.08);color:rgba(30,41,59,0.5)}
        [data-theme="light"] .podium-card{background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.08)}
        [data-theme="light"] .theme-toggle{background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.1);color:#6366f1}
        [data-theme="light"] .theme-toggle:hover{background:rgba(0,0,0,0.08)}

        @media(max-width:768px){
            .podium{flex-direction:column;align-items:center}
            .podium-card{flex:0 1 100%;max-width:280px}
            .lb-table thead th,.lb-table tbody td{padding:12px 14px;font-size:.85rem}
        }
    </style>
</head>
<body>
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="page-wrapper">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="dashboard.html"><i class="bi bi-mortarboard-fill me-2"></i>CCS Sit-in Monitoring</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-lg-center gap-lg-1">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-house me-1"></i>Home</a></li>
                        <li class="nav-item"><a class="nav-link active" href="leaderboard.html"><i class="bi bi-trophy me-1"></i>Leaderboard</a></li>
                        <li class="nav-item ms-lg-2"><button class="theme-toggle" id="themeToggle" title="Toggle theme"><i class="bi bi-sun-fill"></i></button></li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="dashboard-shell container-fluid">
            <!-- Hero -->
            <div class="glass-card lb-hero">
                <div class="lb-hero-icon">🏆</div>
                <h1>Student Leaderboard</h1>
                <p>Top 10 students ranked by total completed sit-in sessions</p>
            </div>

            <!-- Podium (top 3) -->
            <div class="podium" id="podiumContainer" style="display:none;"></div>

            <!-- Table -->
            <div class="glass-card lb-card">
                <div class="lb-loading" id="lbLoading">
                    <div class="spinner-border text-info" role="status"></div>
                    <p class="mt-3">Loading leaderboard…</p>
                </div>
                <div class="lb-empty" id="lbEmpty" style="display:none;">
                    <i class="bi bi-emoji-neutral"></i>
                    <p>No sit-in sessions recorded yet.<br>Complete a session to appear on the leaderboard!</p>
                </div>
                <table class="lb-table" id="lbTable" style="display:none;">
                    <thead>
                        <tr>
                            <th style="width:80px">Rank</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th style="text-align:right">Total Points</th>
                        </tr>
                    </thead>
                    <tbody id="lbBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── Theme Toggle ──
        const themeToggle = document.getElementById('themeToggle');
        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('ccs_theme', t);
            themeToggle.innerHTML = t === 'dark'
                ? '<i class="bi bi-sun-fill"></i>'
                : '<i class="bi bi-moon-stars-fill"></i>';
        }
        themeToggle.addEventListener('click', () => {
            applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
        applyTheme(localStorage.getItem('ccs_theme') || 'dark');

        // ── Fetch Leaderboard ──
        const API = 'backend/api/leaderboard.php';

        async function loadLeaderboard() {
            const loading = document.getElementById('lbLoading');
            const empty = document.getElementById('lbEmpty');
            const table = document.getElementById('lbTable');
            const body = document.getElementById('lbBody');
            const podium = document.getElementById('podiumContainer');

            try {
                const res = await fetch(API);
                const data = await res.json();
                loading.style.display = 'none';

                if (!data.success || !data.leaderboard || data.leaderboard.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                const rows = data.leaderboard;

                // Build podium for top 3
                if (rows.length >= 1) {
                    podium.style.display = 'flex';
                    const medals = ['gold', 'silver', 'bronze'];
                    const icons = ['🥇', '🥈', '🥉'];
                    const top = rows.slice(0, 3);
                    podium.innerHTML = top.map((s, i) => `
                        <div class="podium-card ${medals[i]}">
                            <div class="podium-rank ${medals[i]}-text">${icons[i]}</div>
                            <div class="podium-name">${esc(s.student_name)}</div>
                            <div class="podium-id">${esc(s.id_number)}</div>
                            <div class="podium-sessions">${s.total_points}</div>
                            <div class="podium-sessions-label">Sessions</div>
                        </div>
                    `).join('');
                }

                // Build table rows
                const rankClasses = ['row-gold', 'row-silver', 'row-bronze'];
                const badgeClasses = ['rank-gold', 'rank-silver', 'rank-bronze'];
                body.innerHTML = rows.map((s, i) => {
                    const rank = i + 1;
                    const rowCls = i < 3 ? rankClasses[i] : '';
                    const badgeCls = i < 3 ? badgeClasses[i] : 'rank-default';
                    return `
                        <tr class="${rowCls}">
                            <td><span class="rank-badge ${badgeCls}">${rank}</span></td>
                            <td class="student-id">${esc(s.id_number)}</td>
                            <td class="student-name">${esc(s.student_name)}</td>
                            <td style="text-align:right">
                                <span class="session-count">${s.total_points}</span>
                                <span class="session-label">sessions</span>
                            </td>
                        </tr>`;
                }).join('');

                table.style.display = 'table';
            } catch (err) {
                loading.style.display = 'none';
                empty.style.display = 'block';
                empty.querySelector('p').textContent = 'Unable to load leaderboard. Please try again later.';
                console.error('Leaderboard error:', err);
            }
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        loadLeaderboard();
    </script>
</body>
</html>
